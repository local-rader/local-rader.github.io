# AI 질문 중계 서버 설정. 배포는 .github/workflows/ai-worker.yml이 한다.
# __KV_ID__는 배포할 때 횟수 저장소(turnoko-quota)의 번호로 바뀐다.
name = "turnoko-ai"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
# 관리자 화면(/admin) 비밀번호의 SHA-256 값. 비밀번호 자체는 저장소에 두지 않는다.
# 비밀번호를 바꾸려면 새 비밀번호의 SHA-256(소문자 16진수)으로 이 값을 바꾸면 된다.
ADMIN_HASH = "f8ae98769bedb1637df75e869897bf915882085bc525e90dec64029634c942d3"

[[kv_namespaces]]
binding = "QUOTA"
id = "__KV_ID__"
