name: 연립다세대 확인 (임시)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.RTMS_KEY }}
        run: |
          for ep in RTMSDataSvcRHTrade/getRTMSDataSvcRHTrade RTMSDataSvcRHRent/getRTMSDataSvcRHRent RTMSDataSvcSHTrade/getRTMSDataSvcSHTrade; do
            for enc in raw quoted; do
              if [ $enc = raw ]; then KEY="$K"; else KEY=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(urllib.parse.unquote(os.environ['K']),safe=''))"); fi
              out=$(curl -s -m 30 "https://apis.data.go.kr/1613000/$ep?serviceKey=$KEY&LAWD_CD=43113&DEAL_YMD=202609&pageNo=1&numOfRows=1")
              echo "$ep [$enc] -> $(echo "$out" | grep -o '<resultCode>[^<]*</resultCode>\|<returnReasonCode>[^<]*\|<returnAuthMsg>[^<]*\|<totalCount>[^<]*</totalCount>\|SERVICE_KEY_IS_NOT_REGISTERED[^<]*\|Unauthorized\|API not found' | tr '\n' ' ') $(echo "$out" | head -c 120 | tr -d '\n')"
            done
          done
