name: AI 키 점검 (임시)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 서버에 시험 질문
        run: |
          curl -sS -m 60 -X POST -H "Origin: https://local-rader.github.io" -H "content-type: application/json" \
            -H "X-Device: check-run-$RANDOM$RANDOM" \
            -d '{"q":"율량동에 요즘 뭐가 지어지고 있어?","place":"all"}' \
            https://turnoko-ai.turnoko-065f40.workers.dev/ask | cut -c1-900; echo
